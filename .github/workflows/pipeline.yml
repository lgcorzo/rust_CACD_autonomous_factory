name: CI/CD Pipeline

on:
  push:
    paths-ignore:
      - "Wiki/**"
      - "README.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "Wiki/**"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:
  release:
    types:
      - published
      - edited

env:
  DOCKER_IMAGE: lgcorzo/dark-gravity-factory

jobs:
  governance-gates:
    name: Governance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Spec Artifacts
        if: startsWith(github.head_ref, 'specs/') || startsWith(github.ref, 'refs/heads/specs/')
        run: |
          echo "Verifying Spec Artifacts for Spec-Driven Development..."
          # Ensure there is at least one spec.md, plan.md, and tasks.md in the specs/ directory
          if [ -z "$(find specs -name 'spec.md' 2>/dev/null)" ] || [ -z "$(find specs -name 'plan.md' 2>/dev/null)" ] || [ -z "$(find specs -name 'tasks.md' 2>/dev/null)" ]; then
            echo "::error::Missing required spec artifacts (spec.md, plan.md, tasks.md) on a specs/ branch."
            exit 1
          fi
          echo "Spec artifacts verified."

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Verify OSR Threshold
        run: cargo run -p factory-cli -- verify-osr --r2r-url http://localhost:8000

      - name: Cargo Audit
        uses: rustsec/audit-check@v1.4.1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust-ci:
    name: Rust CI (Lint & Test)
    needs: governance-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Lint with Clippy
        run: cargo clippy --workspace -- -D warnings
        
      - name: Run Workspace Tests
        run: cargo test --workspace -- --skip smoke

  docker-publish:
    name: Docker Publish
    needs: rust-ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          push: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
          context: .
          cache-to: type=gha,mode=max
          cache-from: type=gha
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Install Sentry CLI
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        continue-on-error: true
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Create Sentry Release
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: lgcorzo
          SENTRY_PROJECT: rust
        run: |
          VERSION=$(sentry-cli releases propose-version)
          sentry-cli releases new "$VERSION"
          sentry-cli releases set-commits "$VERSION" --auto
          sentry-cli releases finalize "$VERSION"
