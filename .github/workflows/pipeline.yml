name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published
      - edited

env:
  DOCKER_IMAGE: lgcorzo/dark-gravity-factory

permissions:
  contents: read

jobs:
  governance-gates:
    name: Governance Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
 
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable

      - name: Verify Spec Artifacts
        run: python3 scripts/verify_spec_artifacts.py

      - name: Test Spec Artifacts Verification Engine
        run: PYTHONPATH=. pytest tests/test_verify_spec_artifacts.py

      - name: Verify Wiki Flat Export Integrity
        run: python3 scripts/test_prepare_wiki_for_github.py

      - name: Install System Dependencies
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive\.ubuntu\.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15"
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libcurl4-openssl-dev

      - name: Verify OSR Threshold
        run: cargo run -p factory-cli -- verify-osr --r2r-url http://localhost:8000

      - name: Cargo Audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            $HOME/.cargo/bin/cargo-binstall -y --force cargo-audit
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo audit -D warnings

  rust-ci:
    name: Rust CI (Lint & Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Install Protoc
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive\.ubuntu\.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15"
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libcurl4-openssl-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Lint with Clippy
        run: cargo clippy --workspace -- -D warnings
        
      - name: Run Workspace Tests
        run: cargo test --workspace -- --skip smoke

      - name: Run Evidence Contract Gate Tests
        run: cargo test -p factory-cli --test evidence_contract_tests

  evidence-integrity:
    name: Evidence Integrity (ordinary CI — never proves live gVisor)
    runs-on: ubuntu-latest
    needs: [rust-ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - name: Install Protoc
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libcurl4-openssl-dev
      - name: Validate committed evidence (schema, SHA-256, outcomes, transitions, class hierarchy, age)
        run: cargo run -p factory-cli -- validate-evidence --evidence-dir evidence
      - name: Re-execute evidence commands and fail on any failure
        env:
          EVIDENCE_ENV_KIND: ci
          EVIDENCE_COLLECT_LIVE: "false"
        run: bash scripts/generate_evidence.sh
      - name: Upload captured run logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-runs-${{ github.sha }}
          path: evidence/runs/

  docker-publish:
    name: Docker Publish
    needs: [governance-gates, rust-ci]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
      SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to Docker Hub
        if: ${{ env.DOCKER_USER != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          context: .
          cache-to: type=gha,mode=max
          cache-from: type=gha
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dark-gravity-factory:latest
            ghcr.io/${{ github.repository_owner }}/dark-gravity-factory:${{ github.sha }}

      - name: Install Sentry CLI
        if: ${{ env.SENTRY_TOKEN != '' }}
        continue-on-error: true
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Create Sentry Release
        if: ${{ env.SENTRY_TOKEN != '' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: lgcorzo
          SENTRY_PROJECT: rust
        run: |
          VERSION=$(sentry-cli releases propose-version)
          sentry-cli releases new "$VERSION"
          sentry-cli releases set-commits "$VERSION" --auto
          sentry-cli releases finalize "$VERSION"
