# LiteLLM Proxy Configuration: Heterogeneous Multi-Model Routing & Governance
# Enforces strict frontier model separation: Code Generation vs SAST Security Review

model_list:
  # Primary code generation and planning models
  - model_name: gemini-3.8-flash-low
    litellm_params:
      model: openai/gemini-3.8-flash-low
      api_base: "http://antigravity-proxy.llm-apps.svc.cluster.local:8085/v1"
      api_key: "antigravity-local"
      stream: true
      tags:
        - "team:dark-gravity-ops"
        - "epic:E6.3"
        - "tier:planning"

  - model_name: gpt-oss-120b
    litellm_params:
      model: openai/@cf/openai/gpt-oss-120b
      api_base: "os.environ/CLOUDFLARE_API_BASE"
      api_key: "os.environ/CLOUDFLARE_API_TOKEN"
      tags:
        - "team:dark-gravity-ops"
        - "epic:E6.3"
        - "tier:planning"

  - model_name: ollama/qwen2.5:7b
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: "http://ollama-service.llm-apps.svc.cluster.local:11434"
      api_key: "EMPTY"
      num_ctx: 16384
      tags:
        - "team:dark-gravity-ops"
        - "epic:E6.3"
        - "tier:worker"

  # Independent Frontier SAST Governance Review Model (Separated model family from worker/generator)
  - model_name: security_review
    litellm_params:
      model: openai/claude-sonnet-5-5-low
      api_base: "http://antigravity-proxy.llm-apps.svc.cluster.local:8085/v1"
      api_key: "antigravity-local"
      stream: true
      tags:
        - "team:dark-gravity-ops"
        - "epic:E6.3"
        - "tier:sast-governance"
        - "independent_frontier:true"
      rpm: 100
      tpm: 100000

  # Fallback Independent Reviewer
  - model_name: security_review_fallback
    litellm_params:
      model: openai/gemini-4-argon-low
      api_base: "http://antigravity-proxy.llm-apps.svc.cluster.local:8085/v1"
      api_key: "antigravity-local"
      stream: true
      tags:
        - "team:dark-gravity-ops"
        - "epic:E6.3"
        - "tier:sast-governance-fallback"

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false
  virtual_key_spend_tracking: true
  max_budget: 50.0
  budget_duration: "1d"

router_settings:
  routing_strategy: "latency-based-routing"
  redis_host: "redis.factory-sandbox.svc.cluster.local"
  redis_port: 6379

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: false
