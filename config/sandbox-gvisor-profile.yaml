apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    sandbox.gvisor.io/enabled: "true"
---
apiVersion: v1
kind: Pod
metadata:
  name: zeroclaw-sandbox-template
  namespace: factory-sandbox
  labels:
    app.kubernetes.io/name: zeroclaw-worker
    security.darkgravity.io/sandbox: gvisor
    security.darkgravity.io/tier: zero-trust
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: zeroclaw-worker
      image: ghcr.io/darkgravity/zeroclaw-worker:v7.2
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: "15Mi"
          cpu: "100m"
        limits:
          memory: "30Mi"
          cpu: "250m"
      volumeMounts:
        - name: ephemeral-tmp
          mountPath: /tmp
    - name: ziti-edge-tunnel
      image: openziti/ziti-edge-tunnel:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: "10Mi"
          cpu: "50m"
        limits:
          memory: "20Mi"
          cpu: "100m"
      volumeMounts:
        - name: ziti-identity
          mountPath: /etc/ziti
          readOnly: true
  volumes:
    - name: ephemeral-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 10Mi
    - name: ziti-identity
      secret:
        secretName: zeroclaw-ziti-identity
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeroclaw-sandbox-isolation
  namespace: factory-sandbox
spec:
  podSelector:
    matchLabels:
      security.darkgravity.io/sandbox: gvisor
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openziti
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 10080
