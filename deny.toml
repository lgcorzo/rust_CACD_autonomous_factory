[advisories]
version = 2
ignore = [
    # Transitive/unmaintained crates with no safe upgrade available; tracked for replacement
    { id = "RUSTSEC-2021-0141", reason = "dotenv 0.15.0 used in factory-mcp-server; no safe upgrade" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 transitive via ziti-sdk 0.3.0" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 transitive via serde_yaml" },
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
