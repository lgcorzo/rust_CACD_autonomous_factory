[package]
name = "factory-cli"
version = "0.1.0"
edition = "2024"
default-run = "factory-cli"

[features]
production = ["factory-application/production", "factory-infrastructure/production"]

[dependencies]
factory-application = { path = "../factory-application" }
factory-infrastructure = { path = "../factory-infrastructure" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
anyhow = { workspace = true }
hatchet-sdk = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sentry = "0.48.4"
jemallocator = "0.5.4"
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "v5"] }
chrono = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
hostname = "0.4"
kube = { workspace = true, features = ["runtime", "client", "derive"] }
k8s-openapi = { workspace = true, features = ["schemars"] }
schemars = "1"
serde_yaml = { workspace = true }
